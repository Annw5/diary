<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Цвета светлой темы (переменные: меняем их - меняется весь сайт) */
:root{--bg:#f4f1ec;--fg:#2b2b2b;--glass:rgba(255,255,255,.55)}
/* Цвета тёмной темы */
[data-theme=dark]{--bg:#17181с;--fg:#e6e6e6;--glass:rgba(40,42,50,.55)}
html,body{margin:0;height:100%}
/* Фон: мягкое цветное пятно, чтобы полупрозрачность была видна */
body{background:radial-gradient(circle at 20% 10%,rgba(120,160,255,.25),transparent 50%),var(--bg);
  color:var(--fg);font:18px system-ui,sans-serif;transition:.3s}
#themes{position:fixed;top:12px;right:16px;z-index:2}            /* кнопки тем: правый верхний угол */
#themes button{all:unset;cursor:pointer;font-size:22px;padding:0 6px;opacity:.35} /* без рамок, бледные */
#themes button.on{opacity:1}                                      /* выбранная тема - ярче */
#lock{text-align:center;margin-top:12vh}                          /* блок пароля: сверху по центру */
#pw{all:unset;field-sizing:content;min-width:1px;color:inherit}   /* поле без рамки, растёт по мере ввода */
#us{animation:b 1s steps(1) infinite}                             /* подчёркивание мигает */
@keyframes b{50%{opacity:0}}                                      /* в половине цикла - невидимо */
#page{display:none;position:fixed;inset:0;padding:48px 8vw 40px;overflow:auto; /* дневник: на весь экран */
  background:var(--glass);backdrop-filter:blur(12px)}             /* полупрозрачность + размытие фона */
#t{outline:none;white-space:pre-wrap;min-height:50vh}             /* текст записи: без рамки при вводе */
#pics img{max-width:200px;margin:4px;border-radius:8px}
#num{position:fixed;bottom:10px;width:100%;text-align:center;opacity:.35;font-size:14px;pointer-events:none}
</style>

<div id="themes"><button id="dk">☾</button><button id="lt">☼</button></div>
<div id="lock"><span id="lab">пароль</span> <input id="pw" type="password" autofocus><span id="us">_</span></div>
<div id="page"><div id="deco"></div><div id="t" contenteditable></div><div id="pics"></div></div>
<div id="num"></div>

<script>
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = id => document.getElementById(id);
const u32 = n => new Uint8Array(new Uint32Array([n]).buffer);
let key, salt, file, handle, idx = [], cur = 0, photos = [], dirty = false, timer, memo = {}, last = '';
// memo - запомненный код записей (чтобы не расшифровывать повторно), last - код, который показан сейчас

// ---------- Темы ----------
function theme(m) {
  document.documentElement.dataset.theme = m;       // пишем тему в <html>, CSS сам подхватит цвета
  $('dk').className = m == 'dark' ? 'on' : '';      // подсвечиваем выбранную кнопку
  $('lt').className = m == 'dark' ? '' : 'on';
  localStorage.theme = m;                           // запоминаем выбор
}
theme(localStorage.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'));
$('dk').onclick = () => theme('dark');
$('lt').onclick = () => theme('light');

  // ---------- Файл ----------
async function makeKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function write(parts) {
  const w = await handle.createWritable();
  await w.write(new Blob(parts));
  await w.close();
  file = await handle.getFile();
}
async function scan() {                              // идём по меткам, запоминаем где запись и есть ли в ней код
  idx = []; memo = {}; let pos = 16;
  while (pos < file.size) {
    const h = new Uint8Array(await file.slice(pos, pos + 5).arrayBuffer()); // 4 байта метки + 1 байт флага
    const n = new DataView(h.buffer).getUint32(0, true);
    idx.push({s: pos + 4, n, f: h[4]});              // f = 1, если в записи есть код оформления
    pos += 4 + n;
  }
}

// ---------- Чтение записи и оформления ----------
async function open(i) {                             // достаём и расшифровываем запись i
  const {s, n} = idx[i];
  const b = new Uint8Array(await file.slice(s + 1, s + n).arrayBuffer()); // s+1: пропускаем байт-флаг
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: b.slice(0,12)}, key, b.slice(12));
  const jl = new DataView(plain).getUint32(0, true);
  const meta = JSON.parse(dec.decode(plain.slice(4, 4 + jl)));
  let pos = 4 + jl, p = [];
  for (const size of meta.p) { p.push(new Blob([plain.slice(pos, pos + size)], {type:'image/webp'})); pos += size; }
  return {t: meta.t, p};
}
// Вытаскиваем всё, что лежит между <<< и >>>
const getCode = text => (text.match(/<<<([\s\S]*?)>>>/g) || []).map(m => m.slice(3, -3)).join('\n');
// Какое оформление действует на запись i: своё, а если нет - от ближайшей предыдущей с кодом
async function styleFor(i, text) {
  const own = getCode(text);
  if (own) return own;
  for (let k = i - 1; k >= 0; k--)
    if (idx[k].f) return memo[k] ??= getCode((await open(k)).t); // запоминаем, чтобы не расшифровывать снова
  return '';
}
async function deco() {                              // применяем оформление
  const c = await styleFor(cur, $('t').innerText);
  if (c !== last) { $('deco').innerHTML = c; last = c; } // меняем только если код изменился (нет мигания)
}

// ---------- Показ ----------
function draw() {
  $('num').textContent = (cur + 1) + ' / ' + Math.max(idx.length, cur + 1);
  $('pics').innerHTML = '';
  photos.forEach(b => { const im = new Image(); im.src = URL.createObjectURL(b); $('pics').append(im); });
  deco();
}
async function show(i) {
  const e = await open(i);
  cur = i; photos = e.p; $('t').innerText = e.t;
  draw();
}

// ---------- Сохранение ----------
async function save() {
  const text = $('t').innerText;
  if (!text.trim() && !photos.length) return;
  const json = enc.encode(JSON.stringify({t: text, p: photos.map(b => b.size)}));
  const plain = await new Blob([u32(json.length), json, ...photos]).arrayBuffer();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plain);
  // метка (длина = флаг 1 + iv 12 + данные) + флаг "есть код" + iv + данные
  const block = new Blob([u32(13 + ct.byteLength), Uint8Array.of(getCode(text) ? 1 : 0), iv, ct]);
  const parts = [salt];
  idx.forEach((e, k) => parts.push(k == cur ? block : file.slice(e.s - 4, e.s + e.n)));
  if (cur >= idx.length) parts.push(block);
  await write(parts); await scan(); dirty = false;
}
function changed() { dirty = true; clearTimeout(timer); timer = setTimeout(save, 1500); deco(); }
$('t').oninput = changed;

// ---------- Переходы ----------
async function go(i) {
  if (!key || i < 0) return;
  clearTimeout(timer); if (dirty) await save();
  if (i < idx.length) await show(i);
  else if (cur < idx.length) { cur = idx.length; photos = []; $('t').innerText = ''; draw(); }
}
document.onkeydown = e => { if (e.altKey && e.key == 'ArrowLeft') go(cur - 1); if (e.altKey && e.key == 'ArrowRight') go(cur + 1); };
let x0; document.ontouchstart = e => x0 = e.touches[0].clientX;
document.ontouchend = e => { const d = e.changedTouches[0].clientX - x0; if (Math.abs(d) > 100) go(cur + (d < 0 ? 1 : -1)); };

// ---------- Фото ----------
document.ondragover = e => e.preventDefault();
document.ondrop = async e => {
  e.preventDefault();
  for (const f of e.dataTransfer.files) {
    const bmp = await createImageBitmap(f);
    const c = new OffscreenCanvas(bmp.width, bmp.height);
    c.getContext('2d').drawImage(bmp, 0, 0);
    photos.push(await c.convertToBlob({type:'image/webp', quality:0.9}));
  }
  draw(); changed();
};

// ---------- Вход ----------
document.body.onclick = () => $('lock').style.display != 'none' && $('pw').focus();
$('pw').onkeydown = async e => {
  if (e.key != 'Enter') return;
  const root = await navigator.storage.getDirectory();
  handle = await root.getFileHandle('diary2.bin', {create: true});   // diary2: формат файла изменился
  file = await handle.getFile();
  if (file.size == 0) { salt = crypto.getRandomValues(new Uint8Array(16)); await write([salt]); }
  else salt = new Uint8Array(await file.slice(0, 16).arrayBuffer());
  key = await makeKey($('pw').value, salt);
  await scan();
  try { if (idx.length) await show(idx.length - 1); else draw(); }
  catch { key = null; $('pw').value = ''; $('lab').textContent = 'неверно'; setTimeout(() => $('lab').textContent = 'пароль', 1200); return; }
  $('lock').style.display = 'none';
  $('page').style.display = 'block';
};

navigator.storage.persist();
navigator.serviceWorker.register('sw.js');
</script>
</script>
